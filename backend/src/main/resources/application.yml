spring:
  application:
    name: CertChain Backend
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/certchain}
    username: ${DATABASE_USERNAME:certchain}
    password: ${DATABASE_PASSWORD:certchain-local-only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  storage:
    root: ${STORAGE_ROOT:./storage}
  mail:
    from: ${MAIL_FROM:certificates@certchain.local}
  blockchain:
    enabled: ${BLOCKCHAIN_ENABLED:false}
    network: ${BLOCKCHAIN_NETWORK:sepolia}
    chain-id: ${BLOCKCHAIN_CHAIN_ID:11155111}
    rpc-url: ${BLOCKCHAIN_RPC_URL:}
    contract-address: ${BLOCKCHAIN_CONTRACT_ADDRESS:}
    issuer-private-key: ${BLOCKCHAIN_ISSUER_PRIVATE_KEY:}
    confirmations: ${BLOCKCHAIN_CONFIRMATIONS:2}

logging:
  level:
    root: INFO
    com.certchain: INFO
