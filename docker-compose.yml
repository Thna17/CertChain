services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-certchain}
      POSTGRES_USER: ${POSTGRES_USER:-certchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-certchain-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - certchain-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-certchain} -d ${POSTGRES_DB:-certchain}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  certchain-postgres-data:

